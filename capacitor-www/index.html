<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIマルチツール</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f3;
        color: #17211b;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(92vw, 420px);
        border: 1px solid #d6ddd4;
        border-radius: 8px;
        background: white;
        padding: 20px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        line-height: 1.7;
        color: #4b5a50;
      }
      code {
        background: #f1f4f2;
        border-radius: 4px;
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AIマルチツール</h1>
      <p>アプリのサーバーに接続できません。開発時はPC側で <code>npm run dev</code> を起動してください。</p>
    </main>
  </body>
</html>
